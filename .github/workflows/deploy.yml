# ─────────────────────────────────────────────────────────────────────────────
# deploy.yml — Publica el portfolio en GitHub Pages en cada push a main.
# ─────────────────────────────────────────────────────────────────────────────
# Funciona cuando esta carpeta (portfolio/) es la RAÍZ de su propio repositorio.
# Requisito único: en GitHub → Settings → Pages → Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Permisos mínimos: leer el código y publicar en Pages (con token OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Si se hacen dos push seguidos, solo se publica el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 1. Compilar ────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # reutiliza node_modules entre ejecuciones → más rápido

      # npm ci instala exactamente lo que dice package-lock.json (reproducible).
      - run: npm ci

      # Comprueba tipos, compila y pre-renderiza → dist/
      - run: npm run build

      # Empaqueta dist/ como "artefacto" que GitHub Pages sabe servir.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── 2. Publicar ────────────────────────────────────────────────────────────
  deploy:
    needs: build # solo si la compilación ha ido bien
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
